<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zen Tag Rosa</title>
<style>
:root{
  --bg:#f6f2f2; --mint:#d6eee4; --lilac:#e2d9f4; --ink:#3b2c34; --muted:#b3a7ad; --faint:#d8cfd3;
  --rose:#e9a7b9; --rose2:#d27c97; --rose-soft:#f9e4ea;
  --hi:rgba(255,255,255,.95); --lo:rgba(196,168,178,.38);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;
  background:
    radial-gradient(520px 420px at 6% 8%,rgba(214,238,228,.75),transparent 70%),
    radial-gradient(560px 460px at 96% 10%,rgba(226,217,244,.8),transparent 70%),
    radial-gradient(640px 520px at 92% 96%,rgba(247,206,222,.8),transparent 70%),
    radial-gradient(520px 420px at 4% 98%,rgba(250,226,216,.7),transparent 70%),
    radial-gradient(900px 600px at 50% 42%,#fff 0,#f8f4f5 55%,#f3edef 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--rose2);outline-offset:3px}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr;padding:28px 36px 32px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:3}
.left{display:flex;align-items:center;gap:18px}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#f6eff1);
  box-shadow:6px 8px 18px var(--lo),-6px -6px 14px var(--hi);transition:.25s}
.round:hover{transform:translateY(-2px);box-shadow:8px 12px 22px var(--lo),-6px -6px 14px var(--hi)}
.round[aria-expanded=true]{background:linear-gradient(145deg,var(--rose-soft),#fff)}
.round svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:34px;font-weight:600;letter-spacing:-.8px;white-space:nowrap}
h1 span{color:var(--faint);font-weight:500;margin-left:10px;transition:.3s}
.pill{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:99px;font-size:13px;color:var(--muted);
  background:linear-gradient(145deg,#fff,#f6eff1);box-shadow:5px 6px 14px var(--lo),-5px -5px 12px var(--hi)}
.pill i{width:38px;height:24px;border-radius:99px;background:#eadfe3;position:relative;box-shadow:inset 2px 2px 5px rgba(160,130,142,.35);transition:.3s}
.pill i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:2px 3px 6px rgba(120,90,100,.3);transition:.3s}
.pill[aria-pressed=true] i{background:linear-gradient(135deg,var(--rose),var(--rose2))}
.pill[aria-pressed=true] i::after{left:16px}
.pill[aria-pressed=true]{color:var(--rose2)}
/* month popover */
.month{position:absolute;top:66px;left:0;width:290px;padding:18px;border-radius:26px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);
  box-shadow:12px 18px 40px var(--lo),-6px -6px 16px var(--hi);opacity:0;pointer-events:none;transform:translateY(-8px) scale(.98);transition:.25s;z-index:5}
.month.open{opacity:1;pointer-events:auto;transform:none}
.month h2{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between}
.month h2 small{color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.grid b{color:var(--muted);font-weight:500;padding:4px 0}
.grid span{padding:7px 0;border-radius:50%;position:relative}
.grid span.off{color:var(--faint)}
.grid span.today{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;box-shadow:0 8px 14px -6px var(--rose2)}
.grid span.has::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--rose2)}
.grid span.today.has::after{background:#fff}
/* clock */
.center{display:grid;place-items:center;position:relative;min-height:0;padding-bottom:50px}
.glow{position:absolute;width:min(78vh,620px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(233,167,185,.28),rgba(233,167,185,0) 66%);filter:blur(10px);transition:opacity .6s}
.clock{position:relative;width:min(58vh,480px);aspect-ratio:1;border-radius:50%;
  background:linear-gradient(145deg,#fffefe,#f5eced);
  box-shadow:22px 26px 60px rgba(196,168,178,.42),-18px -18px 44px #fff,inset 0 0 0 1px rgba(255,255,255,.7);transition:.6s}
.clock svg{position:absolute;inset:0;width:100%;height:100%}
.hand{transform-origin:200px 200px;transition:transform .4s cubic-bezier(.4,2.2,.5,1)}
.hand.s{transition:none}
.tick{stroke:var(--faint);stroke-width:2;stroke-linecap:round}
.tick.big{stroke:#c9bec4;stroke-width:2.6}
.label{position:absolute;left:50%;top:calc(100% + 18px);transform:translateX(-50%);text-align:center;font-size:13px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.label b{display:block;font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-bottom:2px}
/* todo card */
.todo{position:absolute;left:36px;bottom:32px;width:290px;padding:16px 16px 12px;border-radius:26px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);
  box-shadow:10px 14px 34px var(--lo),-6px -6px 16px var(--hi);transition:.5s;z-index:2}
.todo h3{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.todo ul{list-style:none;padding:0}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13px;line-height:1.35;border-bottom:1px solid rgba(190,160,172,.18)}
.todo li:last-of-type{border:0}
.todo li button.box{flex:none;width:18px;height:18px;border-radius:6px;margin-top:1px;background:#fff;box-shadow:inset 1.5px 1.5px 4px rgba(160,130,142,.35);display:grid;place-items:center}
.todo li button.box svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.todo li[data-done=true] .box{background:linear-gradient(135deg,var(--rose),var(--rose2));box-shadow:0 5px 10px -4px var(--rose2)}
.todo li[data-done=true] .box svg{opacity:1}
.todo li[data-done=true] span{color:var(--muted);text-decoration:line-through}
.todo li small{display:block;color:var(--rose2);font-size:11px}
.add{display:flex;gap:10px;align-items:center;padding-top:8px;color:var(--faint);font-size:13px}
.add input{flex:1;border:0;background:none;font:inherit;color:var(--ink);min-width:0}
.add input::placeholder{color:var(--faint)}
/* mood */
.mood{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;transition:.5s;z-index:2}
.orb{width:62px;height:62px;border-radius:50%;flex:none;background:conic-gradient(from 20deg,#fff3ea,#f6c4d2,#e9a7b9,#fff,#f3d6df,#fff3ea);
  box-shadow:8px 10px 22px var(--lo),-5px -5px 12px var(--hi),inset -4px -6px 10px rgba(210,124,151,.25);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
.mood-box{padding:10px 14px;border-radius:20px;background:rgba(255,255,255,.7);box-shadow:6px 8px 20px var(--lo),-5px -5px 12px var(--hi)}
.mood-box small{display:block;font-size:11px;color:var(--muted)}
.mood-box b{font-size:13px;font-weight:600}
.moods{display:flex;gap:6px;margin-top:8px}
.moods button{padding:4px 10px;border-radius:99px;font-size:11px;color:var(--muted);background:#fff;box-shadow:2px 3px 8px rgba(190,160,172,.3)}
.moods button[aria-pressed=true]{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff}
.eject{position:absolute;right:36px;bottom:32px;z-index:2}
/* focus mode */
body.focus .todo,body.focus .mood,body.focus .eject{opacity:0;pointer-events:none;transform:translateY(12px)}
body.focus .mood{transform:translate(-50%,12px)}
body.focus .clock{transform:scale(1.07)}
body.focus h1 span{color:var(--rose)}
/* responsive */
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;padding:20px 18px 28px;grid-template-rows:auto auto auto auto;gap:22px}
  h1{font-size:24px}.pill{display:none}.round{width:42px;height:42px}
  .center{padding:10px 0 64px}.clock{width:min(84vw,380px)}.glow{width:96vw}
  .todo,.mood,.eject{position:static;transform:none;width:100%}
  .mood{justify-content:center}.eject{display:none}
  body.focus .mood{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="left">
      <button class="round" id="menuBtn" aria-label="Monatskalender" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
      <h1 id="title">Donnerstag<span id="dm">09.04</span></h1>
    </div>
    <button class="pill" id="focusBtn" aria-pressed="false"><i></i>Fokus</button>
    <button class="round" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg></button>
    <div class="month" id="month" role="dialog" aria-label="Monat"></div>
  </header>

  <main class="center">
    <div class="glow" aria-hidden="true"></div>
    <div class="clock" role="img" aria-label="Analoguhr" id="clock">
      <svg viewBox="0 0 400 400" aria-hidden="true">
        <g id="ticks"></g>
        <path id="arc" fill="none" stroke="url(#rg)" stroke-width="5" stroke-linecap="round" opacity=".9"/>
        <circle id="dot" r="7" fill="#fff" stroke="#d27c97" stroke-width="3"/>
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3bccb"/><stop offset="1" stop-color="#d27c97"/></linearGradient></defs>
        <g class="hand" id="hh"><line x1="200" y1="200" x2="200" y2="118" stroke="#3b2c34" stroke-width="5" stroke-linecap="round"/></g>
        <g class="hand" id="mh"><line x1="200" y1="200" x2="200" y2="66" stroke="#3b2c34" stroke-width="3.2" stroke-linecap="round"/></g>
        <g class="hand s" id="sh"><line x1="200" y1="222" x2="200" y2="58" stroke="#d27c97" stroke-width="1.8" stroke-linecap="round"/></g>
        <circle cx="200" cy="200" r="7" fill="#3b2c34"/><circle cx="200" cy="200" r="2.6" fill="#d27c97"/>
      </svg>
      <div class="label" id="label"><b id="digital">--:--</b><span id="next">Kein Termin</span></div>
    </div>
  </main>

  <section class="todo" aria-label="Heute">
    <h3><span>Heute</span><span id="count"></span></h3>
    <ul id="list"></ul>
    <form class="add" id="addForm"><span aria-hidden="true">+</span><input id="addIn" placeholder="Aufgabe hinzufügen" aria-label="Aufgabe hinzufügen" maxlength="60"></form>
  </section>

  <div class="mood">
    <div class="orb" aria-hidden="true"></div>
    <div class="mood-box"><small>Stimmung</small><b id="moodName">Energiegeladen</b>
      <div class="moods" role="group" aria-label="Stimmung">
        <button aria-pressed="true">Energiegeladen</button><button aria-pressed="false">Ruhig</button><button aria-pressed="false">Konzentriert</button>
      </div></div>
  </div>
  <button class="round eject" aria-label="Neuer Termin"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
// ---- time (optional ?zeit=HH:MM for previews)
const q=new URLSearchParams(location.search).get('zeit');
const now=()=>{const d=new Date();if(q){const[h,m]=q.split(':').map(Number);d.setHours(h,m,0,0)}return d};
const APPTS=[{h:9,m:30,t:'Team-Meeting'},{h:13,m:30,t:'Zahnarzt',leave:'13:10'}];
// ticks
$('#ticks').innerHTML=[...Array(12)].map((_,i)=>{const a=i*30*Math.PI/180,big=i%3===0,r1=big?170:176,r2=188;
  return `<line class="tick ${big?'big':''}" x1="${200+Math.sin(a)*r1}" y1="${200-Math.cos(a)*r1}" x2="${200+Math.sin(a)*r2}" y2="${200-Math.cos(a)*r2}"/>`}).join('');
const pt=(deg,r)=>[200+Math.sin(deg*Math.PI/180)*r,200-Math.cos(deg*Math.PI/180)*r];
function tick(){
  const d=now(),s=q?0:d.getSeconds(),m=d.getMinutes()+s/60,h=(d.getHours()%12)+m/60;
  $('#hh').style.transform=`rotate(${h*30}deg)`;$('#mh').style.transform=`rotate(${m*6}deg)`;$('#sh').style.transform=`rotate(${s*6}deg)`;
  $('#digital').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const mins=d.getHours()*60+d.getMinutes(),nx=APPTS.find(a=>a.h*60+a.m>mins);
  if(nx){const diff=nx.h*60+nx.m-mins,hh=Math.floor(diff/60),mm=diff%60;
    $('#next').textContent=`${nx.t} · in ${hh?hh+' Std. ':''}${mm} Min.`;
    const a0=h*30,a1=((nx.h%12)+nx.m/60)*30,end=a1<a0?a1+360:a1,[x0,y0]=pt(a0,158),[x1,y1]=pt(end,158);
    $('#arc').setAttribute('d',`M${x0} ${y0} A158 158 0 ${end-a0>180?1:0} 1 ${x1} ${y1}`);$('#dot').setAttribute('cx',x1);$('#dot').setAttribute('cy',y1);$('#dot').style.display='';
  }else{$('#next').textContent='Heute nichts mehr – genieß die Pause';$('#arc').setAttribute('d','');$('#dot').style.display='none'}
}
tick();setInterval(tick,1000);
// title / date
const d0=now(),wd=d0.toLocaleDateString('de-DE',{weekday:'long'});
$('#title').firstChild.textContent=wd;$('#dm').textContent=String(d0.getDate()).padStart(2,'0')+'.'+String(d0.getMonth()+1).padStart(2,'0');
// month popover
function month(){const y=d0.getFullYear(),m=d0.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,len=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
  const has=new Set([d0.getDate(),d0.getDate()+2,d0.getDate()+5]);let h=`<h2>${d0.toLocaleDateString('de-DE',{month:'long'})}<small>${y}</small></h2><div class="grid">`+['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<b>${x}</b>`).join('');
  for(let i=first-1;i>=0;i--)h+=`<span class="off">${prev-i}</span>`;
  for(let i=1;i<=len;i++)h+=`<span class="${i===d0.getDate()?'today ':''}${has.has(i)?'has':''}">${i}</span>`;
  return h+'</div>'}
$('#month').innerHTML=month();
$('#menuBtn').addEventListener('click',e=>{const o=$('#month').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)});
document.addEventListener('click',e=>{if(!e.target.closest('#month,#menuBtn')){$('#month').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded',false)}});
// focus
$('#focusBtn').addEventListener('click',e=>{const on=document.body.classList.toggle('focus');e.currentTarget.setAttribute('aria-pressed',on)});
// todo
const items=[{t:'Zahnarzt 13:30',s:'Geh um 13:10 los · 20 min Weg'},{t:'Team-Meeting vorbereiten'},{t:'Wegzeit prüfen'}];
const ck='<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
function render(){$('#list').innerHTML=items.map((it,i)=>`<li data-done="${!!it.d}"><button class="box" data-i="${i}" role="checkbox" aria-checked="${!!it.d}" aria-label="${it.t}">${ck}</button><span>${it.t}${it.s?`<small>${it.s}</small>`:''}</span></li>`).join('');
  $('#count').textContent=items.filter(i=>i.d).length+'/'+items.length}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.box');if(b){items[b.dataset.i].d=!items[b.dataset.i].d;render()}});
$('#addForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#addIn').value.trim();if(v){items.push({t:v});$('#addIn').value='';render()}});
render();
// mood
const tint={Energiegeladen:['#e9a7b9','#d27c97'],Ruhig:['#f1c9d4','#c99aa9'],Konzentriert:['#dfa0b4','#b8627f']};
$$('.moods button').forEach(b=>b.addEventListener('click',()=>{$$('.moods button').forEach(o=>o.setAttribute('aria-pressed',o===b));
  const n=b.textContent;$('#moodName').textContent=n;document.documentElement.style.setProperty('--rose',tint[n][0]);document.documentElement.style.setProperty('--rose2',tint[n][1]);
  $('#rg stop:nth-child(1)')&&0;document.querySelectorAll('#rg stop')[0].setAttribute('stop-color',tint[n][0]);document.querySelectorAll('#rg stop')[1].setAttribute('stop-color',tint[n][1]);
  $('#dot').setAttribute('stroke',tint[n][1]);$('#sh line').setAttribute('stroke',tint[n][1])}));
</script>
</body>
</html>
